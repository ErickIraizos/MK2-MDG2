# Plantilla Nginx para produccion en AWS EC2 (Ubuntu)
# Copiar o enlazar a /etc/nginx/sites-available/psi-aprende y ajustar la ruta `root` al repo clonado.

server {
    listen 80;
    server_name _;

    # Permitir subidas de hasta 15 MB (imagenes/QRs/comprobantes 4 MB; documentos clinicos/informes/materiales 10 MB)
    client_max_body_size 15M;

    # Carpeta compilada del frontend Vite (`npm --prefix frontend run build`)
    root /home/ubuntu/MK2-MDG2/frontend/dist;
    index index.html;

    # Compresion Gzip para SPA y assets
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Evitar cache obsoleto en entrypoint SPA y Service Worker PWA
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Cache largo para bundles con hash generados por Vite
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Defensa adicional: bloquear acceso estatico a rutas historicas privadas
    location ~ ^/uploads/(receipts|reports|patient_documents|consents)/ {
        return 403;
    }

    # Proxy inverso al backend Express/PM2 (incluye soporte SSE para /api/notifications/stream)
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 120s;
    }

    # Fallback SPA para rutas de la aplicacion
    location / {
        try_files $uri $uri/ /index.html;
    }
}
