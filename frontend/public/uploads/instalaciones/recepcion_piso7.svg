<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 500' width='100%' height='100%'>
  <defs>
    <linearGradient id='wallGrad' x1='0%' y1='0%' x2='0%' y2='100%'>
      <stop offset='0%' stop-color='#F8F6FE'/>
      <stop offset='100%' stop-color='#EDE8F5'/>
    </linearGradient>
    <linearGradient id='floorGrad' x1='0%' y1='0%' x2='0%' y2='100%'>
      <stop offset='0%' stop-color='#E2E8F0'/>
      <stop offset='100%' stop-color='#CBD5E1'/>
    </linearGradient>
    <linearGradient id='deskGrad' x1='0%' y1='0%' x2='100%' y2='0%'>
      <stop offset='0%' stop-color='#584294'/>
      <stop offset='100%' stop-color='#7B66B5'/>
    </linearGradient>
  </defs>

  <!-- Fondo / Pared -->
  <rect width='800' height='360' fill='url(#wallGrad)'/>
  <!-- Piso parquet suave -->
  <rect y='360' width='800' height='140' fill='url(#floorGrad)'/>

  <!-- Cuadro / Logotipo en la pared -->
  <rect x='300' y='45' width='200' height='78' rx='12' fill='#FFFFFF' stroke='#7B66B5' stroke-width='2' filter='drop-shadow(0 4px 12px rgba(88,66,148,0.1))'/>
  <text x='400' y='82' font-family='system-ui, sans-serif' font-weight='800' font-size='22' fill='#584294' text-anchor='middle'>PSI APRENDE</text>
  <text x='400' y='104' font-family='system-ui, sans-serif' font-weight='700' font-size='8.5' fill='#15968D' text-anchor='middle' letter-spacing='1'>CENTRO CLÍNICO &amp; PSICOPEDAGÓGICO</text>

  <!-- Ventana con luz natural a la izquierda -->
  <rect x='40' y='60' width='140' height='200' rx='8' fill='#BFDBFE' stroke='#94A3B8' stroke-width='3'/>
  <line x1='110' y1='60' x2='110' y2='260' stroke='#94A3B8' stroke-width='2'/>
  <line x1='40' y1='160' x2='180' y2='160' stroke='#94A3B8' stroke-width='2'/>

  <!-- Mostrador de Recepción -->
  <rect x='460' y='210' width='280' height='160' rx='14' fill='url(#deskGrad)'/>
  <rect x='450' y='198' width='300' height='18' rx='8' fill='#FFFFFF' stroke='#EDE8F5' stroke-width='1.5'/>
  <text x='600' y='285' font-family='system-ui, sans-serif' font-weight='700' font-size='13' fill='#FFFFFF' text-anchor='middle'>RECEPCIÓN &amp; ADMISIONES</text>

  <!-- Computadora en recepción -->
  <rect x='570' y='160' width='60' height='38' rx='4' fill='#334155'/>
  <rect x='595' y='198' width='10' height='8' fill='#64748B'/>

  <!-- Sala de Espera: Sillones ergonómicos para familias -->
  <rect x='110' y='280' width='150' height='75' rx='14' fill='#7B66B5' opacity='0.9'/>
  <rect x='90' y='310' width='190' height='45' rx='10' fill='#584294'/>
  <!-- Cojines mint -->
  <rect x='125' y='295' width='35' height='30' rx='6' fill='#2DB9AE'/>
  <rect x='175' y='295' width='35' height='30' rx='6' fill='#2DB9AE'/>

  <!-- Mesita infantil con cuentos y estimulación -->
  <rect x='285' y='330' width='90' height='55' rx='8' fill='#FFFFFF' stroke='#CBD5E1' stroke-width='2'/>
  <!-- Bloques lúdicos infantiles -->
  <rect x='305' y='318' width='18' height='14' rx='2' fill='#F59E0B'/>
  <rect x='330' y='314' width='22' height='18' rx='3' fill='#10B981'/>
  <circle cx='340' cy='306' r='6' fill='#EC4899'/>

  <!-- Planta decorativa -->
  <ellipse cx='745' cy='385' rx='20' ry='8' fill='#94A3B8'/>
  <path d='M745 375 C740 330 710 300 710 270 C745 285 750 320 745 375 Z' fill='#10B981'/>
  <path d='M745 375 C750 320 780 290 780 260 C755 285 745 320 745 375 Z' fill='#059669'/>
</svg>