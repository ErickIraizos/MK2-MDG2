<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 500' width='100%' height='100%'>
  <defs>
    <linearGradient id='skyGrad' x1='0%' y1='0%' x2='0%' y2='100%'>
      <stop offset='0%' stop-color='#E8F0FE'/>
      <stop offset='100%' stop-color='#D5E3F9'/>
    </linearGradient>
    <linearGradient id='buildingGrad' x1='0%' y1='0%' x2='100%' y2='0%'>
      <stop offset='0%' stop-color='#334155'/>
      <stop offset='100%' stop-color='#1E293B'/>
    </linearGradient>
    <linearGradient id='glassGrad' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#93C5FD' stop-opacity='0.85'/>
      <stop offset='100%' stop-color='#3B82F6' stop-opacity='0.65'/>
    </linearGradient>
    <linearGradient id='badgePiso7' x1='0%' y1='0%' x2='100%' y2='0%'>
      <stop offset='0%' stop-color='#584294'/>
      <stop offset='100%' stop-color='#7B66B5'/>
    </linearGradient>
  </defs>

  <rect width='800' height='500' fill='url(#skyGrad)'/>

  <!-- Acera y calle -->
  <rect y='420' width='800' height='80' fill='#64748B'/>
  <rect y='445' width='800' height='55' fill='#475569'/>
  <line x1='0' y1='475' x2='800' y2='475' stroke='#F1F5F9' stroke-width='4' stroke-dasharray='25,20'/>
  <rect y='410' width='800' height='15' fill='#CBD5E1'/>

  <!-- Edificios adyacentes de fondo -->
  <rect x='40' y='140' width='160' height='270' fill='#94A3B8' opacity='0.45'/>
  <rect x='600' y='110' width='160' height='300' fill='#94A3B8' opacity='0.45'/>

  <!-- Edificio Principal: Edificio Guiller -->
  <rect x='220' y='40' width='360' height='370' rx='6' fill='url(#buildingGrad)' stroke='#0F172A' stroke-width='3'/>

  <!-- Pisos y Ventanales -->
  <!-- Piso 8 -->
  <rect x='245' y='60' width='310' height='28' fill='url(#glassGrad)' rx='3'/>
  <!-- Piso 7: PSI APRENDE DESTACADO -->
  <rect x='235' y='98' width='330' height='42' fill='url(#badgePiso7)' rx='5' stroke='#EDE8F5' stroke-width='2'/>
  <text x='400' y='125' font-family='system-ui, sans-serif' font-weight='800' font-size='15' fill='#FFFFFF' text-anchor='middle' letter-spacing='1'>PISO 7 · CENTRO PSI APRENDE (OF. 706)</text>

  <!-- Pisos 6, 5, 4, 3, 2 -->
  <rect x='245' y='152' width='310' height='28' fill='url(#glassGrad)' rx='3'/>
  <rect x='245' y='190' width='310' height='28' fill='url(#glassGrad)' rx='3'/>
  <rect x='245' y='228' width='310' height='28' fill='url(#glassGrad)' rx='3'/>
  <rect x='245' y='266' width='310' height='28' fill='url(#glassGrad)' rx='3'/>
  <rect x='245' y='304' width='310' height='28' fill='url(#glassGrad)' rx='3'/>

  <!-- Planta Baja y Entrada Principal -->
  <rect x='230' y='345' width='340' height='65' fill='#1E293B'/>
  <!-- Puerta de Vidrio -->
  <rect x='360' y='352' width='80' height='58' fill='url(#glassGrad)' stroke='#F8FAFC' stroke-width='2' rx='2'/>
  <line x1='400' y1='352' x2='400' y2='410' stroke='#334155' stroke-width='2'/>

  <!-- Placa en el ingreso -->
  <rect x='450' y='360' width='105' height='38' fill='#584294' rx='4' stroke='#EDE8F5' stroke-width='1.5'/>
  <text x='502' y='375' font-family='system-ui, sans-serif' font-weight='800' font-size='9' fill='#FFFFFF' text-anchor='middle'>EDIFICIO GUILLER</text>
  <text x='502' y='390' font-family='system-ui, sans-serif' font-weight='600' font-size='7.5' fill='#E0E7FF' text-anchor='middle'>Calle San Martín · Piso 7</text>

  <!-- Farolas e indicador de calle -->
  <rect x='260' y='380' width='45' height='28' fill='#F59E0B' opacity='0.3' rx='3'/>
  <!-- Letrero de Calle San Martín -->
  <rect x='130' y='365' width='115' height='28' fill='#1E3A8A' rx='4' stroke='#FFFFFF' stroke-width='1.5'/>
  <text x='187' y='383' font-family='system-ui, sans-serif' font-weight='700' font-size='9' fill='#FFFFFF' text-anchor='middle'>Calle San Martín</text>
</svg>