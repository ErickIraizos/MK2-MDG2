  <rect width="600" height="300" fill="url(#funsidown-grad)"/>
  <circle cx="530" cy="50" r="140" fill="#FFFFFF" fill-opacity="0.06"/>
  <circle cx="70" cy="250" r="110" fill="#FFFFFF" fill-opacity="0.04"/>
  
