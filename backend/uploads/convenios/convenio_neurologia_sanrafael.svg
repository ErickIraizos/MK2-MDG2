<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <defs>
    <linearGradient id="sanrafael-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="60%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="cyan-badge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CCFBF1"/>
      <stop offset="100%" stop-color="#99F6E4"/>
    </linearGradient>
  </defs>
  <rect width="600" height="300" fill="url(#sanrafael-grad)"/>
  <circle cx="500" cy="50" r="160" fill="#FFFFFF" fill-opacity="0.05"/>
  <circle cx="100" cy="250" r="120" fill="#FFFFFF" fill-opacity="0.04"/>
  
  <!-- Icono Médico / Neurológico -->
  <g transform="translate(60, 65)">
    <rect width="70" height="70" rx="18" fill="#FFFFFF" fill-opacity="0.15"/>
    <!-- Cruz médica estilizada con ondas -->
    <rect x="30" y="16" width="10" height="38" rx="3" fill="#A7F3D0"/>
    <rect x="16" y="30" width="38" height="10" rx="3" fill="#A7F3D0"/>
    <circle cx="35" cy="35" r="5" fill="#0F766E"/>
  </g>

  <!-- Textos -->
  <rect x="150" y="70" width="200" height="26" rx="13" fill="url(#cyan-badge)"/>
  <text x="250" y="87" fill="#115E59" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="1">INTERCONSULTA MÉDICA</text>
  
  <text x="150" y="125" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800">Centro Neurológico</text>
  <text x="150" y="152" fill="#A7F3D0" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">"San Rafael" Cochabamba</text>
  
  <text x="60" y="210" fill="#CCFBF1" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">Neuropediatría · Electroencefalograma (EEG) · Mapeo Cerebral</text>
  <text x="60" y="235" fill="#99F6E4" font-family="system-ui, -apple-system, sans-serif" font-size="12">Turnos prioritarios en 48h para pacientes de PSI Aprende</text>
  
  <rect x="60" y="260" width="480" height="2" fill="#FFFFFF" fill-opacity="0.15"/>
</svg>
